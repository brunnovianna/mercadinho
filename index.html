<style>
/* Layout: lista de produtos em cartões com seletor de quantidade; barra fixa no rodapé com total e botão de pedido. */
:root {
  --bg: #fff4cc;
  --surface: #ffffff;
  --ink: #10324a;
  --muted: #4d6475;
  --line: #10324a;
  --sun: #ffd23f;
  --sun-ray: #ffc419;
  --pink: #ef476f;
  --teal: #0b6e8f;
  --accent: #ef476f;
  --accent-ink: #ffffff;
  --display: "Archivo Black", "Arial Black", system-ui, sans-serif;
  --script: "Playball", "Brush Script MT", cursive;
  --body: "Poppins", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 16px; line-height: 1.5; padding-bottom: 120px;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header { padding: 32px 0 20px; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.1;
  margin: 0 0 8px; text-wrap: balance; letter-spacing: -0.01em;
}
header p { margin: 0; color: var(--muted); max-width: 46ch; }
.list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center;
}
.thumb {
  width: 88px; height: 88px; border-radius: 10px; object-fit: contain; display: block;
  background: #fff; border: 1px solid var(--line);
}
.thumb-empty {
  display: grid; place-items: center; color: var(--muted);
  font-family: var(--display); font-weight: 600; font-size: 0.9375rem;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.name { font-weight: 600; margin: 0; }
.size { color: var(--muted); font-size: 0.875rem; margin: 2px 0 0; }
.sku { color: var(--muted); font-size: 0.6875rem; margin: 2px 0 0; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; opacity: 0.8; }
.price {
  font-family: var(--display); font-weight: 600; font-size: 1.375rem; margin: 0;
  font-variant-numeric: tabular-nums;
}
.unit { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line);
}
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.picked { color: var(--muted); font-size: 0.8125rem; margin: 6px 0 0; min-height: 1.2em; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-size: 1.25rem; font-weight: 600; cursor: pointer;
}
.qty button:hover { border-color: var(--accent); }
.qty output { min-width: 2ch; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { color: var(--muted); font-size: 0.875rem; margin: 20px 0 0; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--line); padding: 12px 16px;
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; }
.total small { display: block; color: var(--muted); font-size: 0.8125rem; }
.total strong { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.cta {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
  padding: 14px 18px; font: 600 1rem var(--body); text-decoration: none; cursor: pointer; white-space: nowrap;
}
.cta[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.toast { color: var(--muted); font-size: 0.8125rem; min-height: 1.2em; margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .qty button { transition: border-color .15s; } }

/* Estilo "cartaz de mercadinho", igual à imagem de compartilhamento */
.top { padding: 22px 0 2px; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; margin: 0 0 8px; color: var(--ink); letter-spacing: -0.01em; text-wrap: balance; }
.top .updated { font-size: 0.75rem; }
.top p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 0.875rem; }
.wrap > .note:first-child { margin-top: 0; }
.list { margin-top: 22px; gap: 16px; }
.item { border: 1px solid rgba(16, 50, 74, 0.10); border-radius: 18px; box-shadow: 0 2px 10px rgba(16, 50, 74, 0.08); }
.thumb { border: 1px solid rgba(16, 50, 74, 0.10); border-radius: 12px; background: #fff; }
.price { font-family: var(--display); font-weight: 400; }
.price .unit { font-family: var(--body); font-weight: 500; }
.qty button { border: 0; background: var(--sun); box-shadow: none; }
.qty button:hover { background: #ffe27a; }
.qty button:active { background: #ffc419; }
.chip { border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(16, 50, 74, 0.25); }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--pink); }
.bar { background: var(--ink); border-top: 0; color: #fff; }
.total small { color: var(--sun); }
.total strong { font-family: var(--display); font-weight: 400; color: #fff; }
.toast { color: #cfe0ea; }
.cta { background: var(--pink); color: #fff; border: 0; box-shadow: none; }
.cta[aria-disabled="true"] { opacity: 0.5; }
.soldout .thumb { filter: grayscale(1); opacity: 0.6; }
.soldout .price { color: var(--muted); }
.out { display: inline-block; margin: 6px 0 0; padding: 2px 10px; border-radius: 999px; background: #fde2e8; color: #b3264a; font-size: 0.75rem; font-weight: 600; }
.qty button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

];

const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

// Cada linha do pedido é um produto simples ou uma opção de um produto com variantes.
const LINES = PRODUCTS.flatMap(p => p.variants
  ? p.variants.map(v => ({ key: `${p.id}-${v.key}`, pid: p.id, name: p.name, desc: `${p.size} · ${v.label}`, sku: v.sku, price: p.price }))
  : [{ key: p.id, pid: p.id, name: p.name, desc: p.size, sku: p.sku, price: p.price }]);
const qty = Object.fromEntries(LINES.map(l => [l.key, 0]));
const selected = Object.fromEntries(PRODUCTS.filter(p => p.variants).map(p => [p.id, p.variants[0].key]));
const list = document.getElementById("list");

function currentKey(p) { return p.variants ? `${p.id}-${selected[p.id]}` : p.id; }
function currentVariant(p) { return p.variants.find(v => v.key === selected[p.id]); }

PRODUCTS.forEach(p => {
  const li = document.createElement("li");
  li.className = "item" + (p.soldOut ? " soldout" : "");
  const v = p.variants ? currentVariant(p) : null;
  const img = v ? v.img : p.img;
  const sizeText = v ? `${p.size} · ${v.label}` : p.size;
  const skuText = v ? v.sku : p.sku;
  const chips = p.variants ? `
      <div class="chips" role="group" aria-label="Opções de ${p.name}">
        ${p.variants.map(o => `<button type="button" class="chip" id="chip-${p.id}-${o.key}" aria-pressed="${o.key === selected[p.id]}" aria-label="${o.label}" title="${o.label}" style="background:${o.color}"></button>`).join("")}
      </div>
      <p class="picked" id="picked-${p.id}"></p>` : "";
  li.innerHTML = `
    <img class="thumb" id="img-${p.id}" src="${img}" alt="${p.name} ${sizeText}">
    <div>
      <p class="name">${p.name}</p>
      <p class="size" id="size-${p.id}">${sizeText}</p>
      <p class="sku" id="sku-${p.id}">#${skuText}</p>${p.soldOut ? '<p class="out">Fora de estoque</p>' : ""}${chips}
      <div class="row">
        <p class="price">${brl(p.price)} <span class="unit">· ${brl(p.price / p.per)}/${p.perUnit}</span></p>
        <div class="qty">
          <button type="button" id="minus-${p.id}" aria-label="Remover um ${p.name}">−</button>
          <output id="q-${p.id}" aria-live="polite">0</output>
          <button type="button" id="plus-${p.id}" aria-label="Adicionar um ${p.name}"${p.soldOut ? " disabled" : ""}>+</button>
        </div>
      </div>
    </div>`;
  list.appendChild(li);
  li.querySelector(`#minus-${p.id}`).addEventListener("click", () => change(p, -1));
  li.querySelector(`#plus-${p.id}`).addEventListener("click", () => change(p, 1));
  if (p.variants) p.variants.forEach(o =>
    li.querySelector(`#chip-${p.id}-${o.key}`).addEventListener("click", () => pick(p, o.key)));
});

function pick(p, key) {
  selected[p.id] = key;
  const v = currentVariant(p);
  p.variants.forEach(o => document.getElementById(`chip-${p.id}-${o.key}`).setAttribute("aria-pressed", String(o.key === key)));
  const img = document.getElementById(`img-${p.id}`);
  img.src = v.img; img.alt = `${p.name} ${p.size} · ${v.label}`;
  document.getElementById(`size-${p.id}`).textContent = `${p.size} · ${v.label}`;
  document.getElementById(`sku-${p.id}`).textContent = `#${v.sku}`;
  document.getElementById(`q-${p.id}`).textContent = qty[currentKey(p)];
}

function change(p, d) {
  const k = currentKey(p);
  qty[k] = Math.max(0, qty[k] + d);
  document.getElementById(`q-${p.id}`).textContent = qty[k];
  if (p.variants) {
    const picked = p.variants.filter(o => qty[`${p.id}-${o.key}`] > 0).map(o => `${qty[`${p.id}-${o.key}`]} ${o.label}`);
    document.getElementById(`picked-${p.id}`).textContent = picked.length ? `No pedido: ${picked.join(", ")}` : "";
  }
  render();
}

function orderText() {
  const blocks = LINES.filter(l => qty[l.key] > 0)
    .map(l => `${l.name}\n${l.desc}\n#${l.sku}\n${qty[l.key]} × ${brl(l.price)} = ${brl(l.price * qty[l.key])}`);
  return `Olá, Brunno!\n\nEsse é meu pedido no Mercadinho do Olympia:\n\n${blocks.join("\n\n")}\n\nTotal: ${brl(total())}`;
}
function total() { return LINES.reduce((s, l) => s + l.price * qty[l.key], 0); }

const cta = document.getElementById("cta");
const toast = document.getElementById("toast");
function render() {
  const t = total();
  document.getElementById("total").textContent = brl(t);
  cta.setAttribute("aria-disabled", t > 0 ? "false" : "true");
  if (WHATSAPP) {
    cta.textContent = "Pedir pelo WhatsApp";
    cta.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(orderText())}`;
    cta.target = "_blank"; cta.rel = "noopener";
  } else {
    cta.textContent = "Copiar pedido";
    cta.href = "#";
  }
}
cta.addEventListener("click", async e => {
  if (WHATSAPP) return;
  e.preventDefault();
  try { await navigator.clipboard.writeText(orderText()); toast.textContent = "Pedido copiado. Cole no WhatsApp."; }
  catch { toast.textContent = "Não foi possível copiar."; }
});

render();
</script>
