<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caça-apê — mapa e ranking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --bad:#b4442f; --bad-soft:#f6e3de;
    --warn:#a8731a; --warn-soft:#f7ecd6; --pending:#8a8983;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%;padding-bottom:env(safe-area-inset-bottom)}
  #map{height:46vh;min-height:260px;flex:none;border-bottom:1px solid var(--line)}
  @media (min-width:900px){
    .app{flex-direction:row}
    #map{height:100%;flex:1;border-bottom:none;border-right:1px solid var(--line)}
    .panel{width:420px;flex:none}
  }
  .panel{flex:1;overflow:auto;padding:14px 14px 40px}
  .row{display:flex;gap:8px;align-items:center}
  .search input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad);border-color:#e8c7bf}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
  .btn:disabled{opacity:.5}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .chip{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .chip.icon{padding:8px 16px;line-height:0}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .section-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .results{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .results button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:14px}
  .results button:last-child{border-bottom:0}
  .hint{font-size:13px;color:var(--muted);margin:6px 0}
  .banner{background:var(--warn-soft);color:#5d420f;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
  .card.disq{opacity:.6}
  .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--pending)}
  .num.done{background:var(--accent)} .num.disq{background:#4a4946} .num.partial{background:var(--warn)}
  .card .body{flex:1;min-width:0}
  .card .addr{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .score{flex:none;text-align:right}
  .score b{font-size:20px;display:block;line-height:1}
  .score small{font-size:11px;color:var(--muted)}
  .rank{font-size:11px;color:var(--muted)}
  .card{cursor:pointer}
  .del{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:8px;margin:-8px -6px -8px 0;border-radius:8px}
  .del.armed{background:var(--bad);color:#fff;font-size:13px;padding:8px 10px}
  .empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
  .settings{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .settings label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  .settings input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}
  .wgrid{display:grid;grid-template-columns:1fr 70px;gap:6px 10px;align-items:center;font-size:14px}
  .wgrid input{width:70px!important}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;z-index:2000;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex}
  @media (min-width:700px){.scrim{align-items:center}}
  .sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:700px){.sheet{border-radius:18px}}
  .sheet h2{font-size:18px;margin:0 0 4px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .phase{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;margin-bottom:10px}
  .phase.dq{background:var(--bad-soft);color:var(--bad)}
  .phase.pos{background:var(--accent-soft);color:var(--accent)}
  .phase.neg{background:var(--warn-soft);color:var(--warn)}
  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
  .progress i{display:block;height:100%;background:var(--accent)}
  .question{font-size:22px;font-weight:650;margin:4px 0 6px}
  .qpts{color:var(--muted);font-size:13px;margin-bottom:16px}
  .answers{display:grid;gap:8px}
  .answers button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;text-align:left;display:flex;justify-content:space-between}
  .answers button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .answers button span{color:var(--muted);font-size:14px}
  .navrow{display:flex;justify-content:space-between;margin-top:14px}
  .brk{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:10px 0}
  .brk div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .brk div:last-child{border-bottom:0}
  .brk button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%}
  .plus{color:var(--accent);font-weight:600} .minus{color:var(--bad);font-weight:600} .zero{color:var(--muted)}
  .q-unk{color:var(--warn)}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}
  .total b{font-size:30px}
  .disq-box{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px;margin:10px 0;font-weight:600}
  .ref-pin{width:18px;height:18px;border-radius:50%;background:#e0201b;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .leaflet-tooltip.ref-tip{background:#e0201b;color:#fff;border:0;font-weight:600;font-size:12px;padding:2px 6px;box-shadow:none}
  .leaflet-tooltip.ref-tip::before{display:none}
  .refrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:8px}
  .refrow .dot{flex:none;width:14px;height:14px;border-radius:50%;background:#e0201b}
  .refrow input{flex:1;min-width:0;border:0;padding:6px 0;background:transparent;font-weight:600}
  .refrow small{color:var(--muted);white-space:nowrap}
  a.btn{text-decoration:none;color:inherit;display:inline-block}
  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  select.field{appearance:auto}
  .refrow input[type=tel]{display:block}
  .field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
  .center-dot{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <div class="panel">
    <form class="row search" id="searchForm">
      <input id="q" placeholder="Coordenadas ou endereço" autocomplete="off" enterkeyhint="search">
      <button class="btn primary" id="searchBtn">Buscar</button>
    </form>
    <div class="chips">
      <button class="chip icon on" data-mode="add" type="button" aria-label="Adicionar imóvel" title="Adicionar imóvel"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg></button>
      <button class="chip icon" data-mode="center" type="button" aria-label="Definir centro do círculo" title="Definir centro do círculo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg></button>
      <button class="chip icon" data-mode="ref" type="button" aria-label="Ponto de referência" title="Ponto de referência"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="#e0201b" stroke="#e0201b"/><circle cx="12" cy="9.5" r="2.5" fill="#fff" stroke="none"/></svg></button>
    </div>
    <div id="results"></div>
    <div id="banner"></div>

    <div class="section-title" id="listTitle">Imóveis</div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="chips" style="margin:0">
        <button class="chip on" data-sort="score" type="button">Por pontos</button>
        <button class="chip" data-sort="num" type="button">Por número</button>
      </div>
    </div>
    <div id="list"></div>

    <div class="section-title">Corretores</div>
    <div id="brokers"></div>

    <div class="section-title">Pontos de referência</div>
    <div id="refs"></div>

    <div class="section-title">Círculo</div>
    <div class="settings">
      <div class="hint" id="centerInfo">Sem centro definido. Toque no ícone do círculo e cole as coordenadas, busque um endereço ou toque no mapa.</div>
      <label for="radius">Raio (metros)</label>
      <div class="row">
        <input type="range" id="radiusRange" min="200" max="10000" step="50" style="flex:1">
        <input type="number" id="radius" min="50" step="50">
      </div>
    </div>

    <div class="section-title">Pesos</div>
    <details class="settings">
      <summary>Editar pontuação de cada critério</summary>
      <div id="weights"></div>
      <div class="actions"><button class="btn" id="resetWeights" type="button">Restaurar padrão</button></div>
    </details>

    <div class="section-title">Backup</div>
    <div class="settings">
      <div class="hint">Os dados ficam salvos neste navegador. Exporte um backup para levar para outro aparelho.</div>
      <div class="actions">
        <button class="btn" id="exportBtn" type="button">Baixar backup</button>
        <button class="btn" id="copyBtn" type="button">Copiar JSON</button>
        <label class="btn" style="margin:0">Importar<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
if (typeof L === 'undefined'){
  document.getElementById('map').innerHTML = '<div style="padding:20px;font-size:14px;color:#b4442f">O mapa não carregou: este visualizador bloqueia scripts e conexões externas. Abra o arquivo no Chrome/Safari ou publique na Vercel.</div>';
  document.getElementById('searchForm').onsubmit = e => { e.preventDefault(); };
  throw new Error('Leaflet indisponível');
}
/* ---------- critérios ---------- */
const DQ = [
  {key:'animais', q:'Aceita animais?', reason:'Não aceita animais'},
  {key:'tela',    q:'Aceita colocar tela de proteção?', reason:'Não aceita tela de proteção'},
  {key:'quartos', q:'Tem 3 quartos ou mais?', reason:'Menos de 3 quartos'},
  {key:'sol',     q:'Bate sol?', reason:'Não bate sol'},
  {key:'suv',     q:'Cabe uma SUV na garagem?', reason:'SUV não cabe na garagem'},
];
// ordem de pergunta = ordem da lista (maior peso primeiro). "circulo" é calculado pelo mapa.
const POS = [
  {key:'circulo', label:'Distância da orla', auto:true},
  {key:'valor', label:'Valor', q:'Qual o valor total?', choices:[
    {v:'5k', t:'Até R$ 5 mil'}, {v:'6k', t:'Até R$ 6 mil'}, {v:'7k', t:'Até R$ 7 mil'}, {v:'mais', t:'Acima de R$ 7 mil'}]},
  {key:'metragem', label:'Metragem', q:'Qual a metragem?', choices:[
    {v:'135', t:'Acima de 135 m²'}, {v:'120', t:'Acima de 120 m² (até 135)'}, {v:'menos', t:'120 m² ou menos'}]},
  {key:'vaga', label:'Vaga demarcada', q:'A vaga é demarcada?'},
  {key:'portaria', label:'Portaria', q:'Tem portaria?'},
  {key:'armario', label:'Armários', q:'Tem armários?'},
  {key:'varanda', label:'Varanda', q:'Tem varanda?'},
  {key:'bicicletario', label:'Bicicletário', q:'Tem bicicletário?'},
  {key:'split', label:'Ar split', q:'Tem ar split (ou infra para split)?'},
  {key:'elevador', label:'Elevador', q:'Tem elevador?'},
  {key:'v110', label:'110V', q:'A voltagem é 110V?'},
];
const NEG = [
  {key:'fianca', label:'Só seguro fiança', q:'Só aceita seguro fiança?'},
  {key:'chato', label:'Proprietário chato', q:'O proprietário é chato?'},
  {key:'andarBaixo', label:'Andar baixo', q:'O andar é baixo?'},
  {key:'movimentada', label:'Frente p/ rua movimentada', q:'É de frente para rua movimentada?'},
];
// faixas da distância até o centro do círculo, em % do raio
const ORLA = [{v:'25', t:'até 25% do raio'}, {v:'50', t:'25 a 50% do raio'}, {v:'75', t:'50 a 75% do raio'}, {v:'100', t:'75 a 100% do raio'}];
const DEFAULT_W = {
  circulo:{'25':11,'50':8,'75':6,'100':3},
  valor:{'5k':10,'6k':7,'7k':3,'mais':0},
  metragem:{'135':9,'120':5,'menos':0},
  vaga:8, portaria:7, armario:6, varanda:5, bicicletario:4, split:3, elevador:2, v110:1,
  fianca:4, chato:3, andarBaixo:2, movimentada:1
};

/* ---------- estado ---------- */
const KEY = 'cacaApe.v1';
let S = load();
// numeração sempre 1..n, na ordem em que os imóveis foram adicionados
function renumber(){ S.items.sort((a,b)=>a.num-b.num).forEach((it,i)=>it.num=i+1); S.nextNum = S.items.length+1; }
function removeItem(id){ const it = S.items.find(x=>x.id===id); S.items = S.items.filter(x=>x.id!==id); renumber(); save(); renderAll(); return it; }
renumber();
function blank(){ return {center:null, radius:1500, items:[], refs:[], brokers:[], nextNum:1, sort:'score', W:structuredClone(DEFAULT_W)}; }
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return hydrate(JSON.parse(raw)); }catch(e){}
  return blank();
}
// completa dados salvos por versões antigas (ex.: círculo valia um número só)
function hydrate(d){
  const W = Object.assign(structuredClone(DEFAULT_W), d.W||{});
  if (typeof W.circulo === 'number'){ const n = W.circulo; W.circulo = {'25':n, '50':Math.round(n*.75), '75':Math.round(n*.5), '100':Math.round(n*.25)}; }
  return Object.assign(blank(), d, {W, refs:d.refs||[], brokers:d.brokers||[]});
}
let saveOk = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); saveOk = true; }
  catch(e){ saveOk = false; }
  renderBanner();
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function dist(a,b){ const R=6371000, r=Math.PI/180; const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function inside(it){ return S.center ? dist(S.center, it) <= S.radius : null; }
function orlaFrac(it){ return S.center ? dist(S.center, it) / S.radius : null; }
function orlaTier(it){ const f = orlaFrac(it); if (f === null) return null; return f<=.25?'25':f<=.5?'50':f<=.75?'75':f<=1?'100':'fora'; }
function orlaTxt(it){ const f = orlaFrac(it); if (f === null) return 'sem círculo'; return fmtDist(dist(S.center,it)) + (f<=1 ? ' · ' + Math.round(f*100) + '% do raio' : ' · fora do círculo'); }
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1).replace('.',',')+' km' : Math.round(m)+' m'; }
function shortAddr(d){ return d.split(',').slice(0,3).join(',').trim(); }

/* ---------- pontuação ---------- */
function status(it){
  const a = it.answers||{};
  if (DQ.some(d => a[d.key] === false)) return 'disq';
  const keys = [...DQ.map(d=>d.key), ...POS.filter(p=>!p.auto).map(p=>p.key), ...NEG.map(n=>n.key)];
  const answered = keys.filter(k => k in a && a[k] !== null).length;
  if (answered === 0) return 'pending';
  return answered === keys.length ? 'done' : 'partial';
}
function breakdown(it){
  const a = it.answers||{}, W = S.W, rows = [];
  const tier = orlaTier(it);
  rows.push({key:'circulo', label:'Distância da orla', val: orlaTxt(it), pts: tier ? (W.circulo[tier]||0) : 0, unk: tier===null});
  for (const p of POS.filter(p=>!p.auto)){
    const v = a[p.key];
    if (p.choices){
      const c = p.choices.find(c=>c.v===v);
      rows.push({key:p.key, label:p.label, val:c?c.t:'—', pts:c?(W[p.key][v]||0):0, unk:!c});
    } else {
      rows.push({key:p.key, label:p.label, val:v===true?'Sim':v===false?'Não':'—', pts:v===true?W[p.key]:0, unk:v==null});
    }
  }
  for (const n of NEG){
    const v = a[n.key];
    rows.push({key:n.key, label:n.label, val:v===true?'Sim':v===false?'Não':'—', pts:v===true?-W[n.key]:0, unk:v==null, neg:true});
  }
  return rows;
}
function score(it){ return status(it)==='disq' ? null : breakdown(it).reduce((s,r)=>s+r.pts,0); }
function maxScore(){ const W=S.W; return Math.max(...Object.values(W.circulo))+Math.max(...Object.values(W.valor))+Math.max(...Object.values(W.metragem))+POS.filter(p=>!p.auto&&!p.choices).reduce((s,p)=>s+W[p.key],0); }
function disqReason(it){ const a=it.answers||{}; return DQ.filter(d=>a[d.key]===false).map(d=>d.reason).join(' · '); }

/* ---------- mapa ---------- */
const COLORS = {done:'#2f6f5e', partial:'#a8731a', pending:'#8a8983', disq:'#4a4946'};
const REF_RED = '#e0201b';
const map = L.map('map', {zoomControl:true}).setView([-23.965,-46.333], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
let circle = null, centerMarker = null, markers = [];
function drawCircle(){
  if (circle){ map.removeLayer(circle); circle = null; }
  if (centerMarker){ map.removeLayer(centerMarker); centerMarker = null; }
  if (!S.center) return;
  circle = L.circle([S.center.lat,S.center.lng], {radius:S.radius, color:'#2f6f5e', weight:2, fillColor:'#2f6f5e', fillOpacity:.1, interactive:false}).addTo(map);
  centerMarker = L.marker([S.center.lat,S.center.lng], {interactive:false, icon:L.divIcon({className:'', html:'<div class="center-dot"></div>', iconSize:[14,14], iconAnchor:[7,7]})}).addTo(map);
}
function drawMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers = S.items.map(it => {
    const m = L.marker([it.lat,it.lng], {icon:L.divIcon({className:'', html:`<div class="pin" style="background:${COLORS[status(it)]}"><span>${it.num}</span></div>`, iconSize:[30,30], iconAnchor:[15,30]})}).addTo(map);
    m.on('click', () => openDetail(it.id));

// Aceita "-23.97073, -46.32421", "-23,9707334, -46,3242166" (vírgula decimal), sem sinal,
// e graus/minutos/segundos: 23°58'14.6"S 46°19'27.2"W
function parseCoords(q){
  let lat, lng, m;
  if ((m = q.match(/(\d{1,2})\s*°\s*(\d{1,2})\s*['′]\s*([\d.,]+)\s*["″]?\s*([NS])[\s,;]*(\d{1,3})\s*°\s*(\d{1,2})\s*['′]\s*([\d.,]+)\s*["″]?\s*([EWOL])/i))){
    const dms = (d, mi, se) => +d + +mi/60 + parseFloat(se.replace(',','.'))/3600;
    lat = dms(m[1],m[2],m[3]) * (/S/i.test(m[4]) ? -1 : 1);
    lng = dms(m[5],m[6],m[7]) * (/[WO]/i.test(m[8]) ? -1 : 1);
  } else if ((m = q.match(/(-?\s?\d{1,2}[.,]\d{3,})\s*[,;\s]\s*(-?\s?\d{1,3}[.,]\d{3,})/))){
    lat = parseFloat(m[1].replace(/\s/g,'').replace(',','.'));
    lng = parseFloat(m[2].replace(/\s/g,'').replace(',','.'));
    if (lng > 0) lng = -lng;            // Brasil inteiro fica a oeste
    if (lat > 6) lat = -lat;            // acima de 6°N não é Brasil: faltou o sinal
  } else return null;
  return (lat >= -35 && lat <= 6 && lng >= -75 && lng <= -33) ? {lat, lng} : null;
}
async function withTimeout(url, ms=8000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function reverseLabel(lat, lng){
  try{
    const d = await withTimeout(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=${lat}&lon=${lng}`, 6000);
    const a = d.address || {}, road = a.road || a.pedestrian;
    if (road) return [road + (a.house_number ? ', ' + a.house_number : ''), a.suburb || a.neighbourhood || a.city_district, a.city || a.town || a.municipality].filter(Boolean).join(' — ');
  }catch(e){}
  return `Ponto ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}
const UF = {'Acre':'AC','Alagoas':'AL','Amapá':'AP','Amazonas':'AM','Bahia':'BA','Ceará':'CE','Distrito Federal':'DF','Espírito Santo':'ES','Goiás':'GO','Maranhão':'MA','Mato Grosso':'MT','Mato Grosso do Sul':'MS','Minas Gerais':'MG','Pará':'PA','Paraíba':'PB','Paraná':'PR','Pernambuco':'PE','Piauí':'PI','Rio de Janeiro':'RJ','Rio Grande do Norte':'RN','Rio Grande do Sul':'RS','Rondônia':'RO','Roraima':'RR','Santa Catarina':'SC','São Paulo':'SP','Sergipe':'SE','Tocantins':'TO'};
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function parseNumber(q){
  const s = q.replace(/\b\d{5}-?\d{3}\b/g,' ');
  const m = s.match(/(?:,|\bn[º°o.]?|\bn[uú]mero)\s*(\d{1,5})\b/i);
  if (m) return +m[1];
  const all = [...s.matchAll(/\s(\d{1,5})\b(?!\s*(?:de|º|ª)\b)/gi)];
  return all.length ? +all[all.length-1][1] : null;
}
// Busca por texto no OpenStreetMap. Trechos da mesma rua (um por bairro) viram um resultado só;
// o bairro certo do número sai da faixa de numeração dos CEPs (ViaCEP).
async function geocode(q){
  const num = parseNumber(q);
  const d = await withTimeout('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=15&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q));
  const groups = new Map(), out = [];
  for (const x of d){
    const a = x.address||{};
    const r = {lat:+x.lat, lon:+x.lon, road:a.road||a.pedestrian||a.footway||x.name, hn:a.house_number||null,
      suburb:a.suburb||a.neighbourhood||a.city_district||a.quarter||'', city:a.city||a.town||a.municipality||a.village||'',
      uf:(a['ISO3166-2-lvl4']||'').replace('BR-','') || UF[a.state] || '', num};
    const approx = num && !r.hn;
    const k = norm(approx ? [r.road, r.city].join('|') : [r.road, r.hn, r.suburb, r.city].join('|'));
    if (groups.has(k)){ groups.get(k).segments.push({lat:r.lat, lon:r.lon, suburb:r.suburb}); continue; }
    r.segments = [{lat:r.lat, lon:r.lon, suburb:r.suburb}];
    groups.set(k, r); out.push(r);
  }
  for (const r of out){
    const n = r.hn || r.num, showSub = r.hn || r.segments.length === 1 || !r.num;
    r.label = [r.road ? r.road + (n ? ', ' + n : '') : null, showSub ? r.suburb : null, r.city ? r.city + (r.uf ? ' - ' + r.uf : '') : null].filter(Boolean).join(' — ');
  }
  return out.slice(0, 6);
}
function inRange(comp, n){
  const c = norm(comp);
  if (!c) return true;
  let lo = 0, hi = Infinity, m;
  if ((m = c.match(/de\s+(\d+)(?:\/(\d+))?\s+ao\s+fim/))) lo = +m[1];
  else if ((m = c.match(/de\s+(\d+)(?:\/(\d+))?\s+a\s+(\d+)(?:\/(\d+))?/))) { lo = +m[1]; hi = +(m[4]||m[3]); }
  else if ((m = c.match(/ate\s+(\d+)(?:\/(\d+))?/))) hi = +(m[2]||m[1]);
  else if (!/lado/.test(c)) return false;
  if (/lado\s+impar/.test(c) && n % 2 === 0) return false;
  if (/lado\s+par/.test(c) && n % 2 === 1) return false;
  return n >= lo && n <= hi;
}
async function bairroDoNumero(r){
  if (!r.num || r.hn || !r.road || !r.city || !r.uf || r.segments.length < 2) return null;
  for (const t of [r.road, r.road.replace(/^(rua|avenida|av\.?|travessa|alameda|praca|praça|estrada|rodovia)\s+/i,'')]){
    if (t.length < 3) continue;
    try{
      const rows = await withTimeout(`https://viacep.com.br/ws/${r.uf}/${encodeURIComponent(r.city)}/${encodeURIComponent(t)}/json/`, 7000);
      if (!Array.isArray(rows) || !rows.length) continue;
      const same = rows.filter(x => norm(x.logradouro) === norm(r.road)), pool = same.length ? same : rows;
      const hit = pool.find(x => x.complemento && inRange(x.complemento, r.num));
      return hit ? hit.bairro : null;
    }catch(e){}
  }
  return null;
}
function showResults(q, data){
  const box = $('#results');
  if (!data.length){
    box.innerHTML = `<div class="banner"><span>Nenhum resultado. Marque tocando no mapa.</span><button class="btn" type="button" id="manualBtn">Marcar no mapa</button></div>`;
    $('#manualBtn').onclick = () => startManual(q); return;
  }
  box.innerHTML = '<div class="results">' + data.map((d,i)=>`<button type="button" data-i="${i}">${esc(d.label)}</button>`).join('') +
    `<button type="button" data-manual="1" style="color:var(--muted)">Nenhum desses — marcar no mapa</button></div>`;
  box.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {

}
async function resolveResult(d){
  const bairro = await bairroDoNumero(d);
  if (!bairro) return {lat:d.lat, lon:d.lon, label:d.label};
  const seg = d.segments.find(x => norm(x.suburb) === norm(bairro)) || d.segments[0];
  return {lat:seg.lat, lon:seg.lon, label:[d.road + ', ' + d.num, bairro, d.city + (d.uf ? ' - ' + d.uf : '')].join(' — ')};
}

function steps(){
  return [
    ...DQ.map(d=>({...d, phase:'dq'})),
    ...POS.filter(p=>!p.auto).map(p=>({...p, phase:'pos'})),
    ...NEG.map(n=>({...n, phase:'neg'})),

}
function startWizard(id, i){ renderStep(id, i); openSheet(); }
function renderStep(id, i){

  let ptsTxt = '';
  if (s.phase==='dq') ptsTxt = '“Não” desclassifica o imóvel.';
  else if (s.phase==='neg') ptsTxt = `“Sim” tira ${W[s.key]} ponto${W[s.key]>1?'s':''}.`;
  else if (!s.choices) ptsTxt = `“Sim” vale ${W[s.key]} ponto${W[s.key]>1?'s':''}.`;

    opts = [{v:true, t:'Sim'}, {v:false, t:'Não'}];

    const c = parseCoords($('#moveInput').value);
    if (!c){ $('#moveMsg').innerHTML = '<div class="hint" style="color:var(--bad)">Não reconheci essas coordenadas. Exemplo: -23,9707334, -46,3242166</div>'; return; }
    it.lat = c.lat; it.lng = c.lng; save(); renderAll(); map.setView([c.lat,c.lng], 17); openDetail(id); toast(`#${it.num} movido`);
  };
  $('#notes').oninput = e => { it.notes = e.target.value; clearTimeout(openDetail._t); openDetail._t = setTimeout(save, 400); };
  $('#redo').onclick = () => renderStep(id, 0);
  $('#locate').onclick = () => { closeSheet(); map.setView([it.lat,it.lng], 17); };
  $('#del').onclick = () => {
    const b = $('#del');
    if (b.dataset.armed){ const n = it.num; removeItem(id); closeSheet(); toast(`#${n} excluído — numeração refeita`); }
    else { b.dataset.armed = 1; b.textContent = 'Toque de novo para excluir'; }
  };
  $('#close').onclick = closeSheet;
  openSheet(); $('#sheet').scrollTop = keepScroll;
}
/* ---------- corretores ---------- */
function brokerOf(it){ return S.brokers.find(b => b.id === it.brokerId) || null; }
function phoneDigits(p){ return String(p||'').replace(/\D/g,'').replace(/^0+/,''); }
function phoneLinks(p){
  const d = phoneDigits(p); if (d.length < 10) return '';
  const intl = d.length <= 11 ? '55' + d : d;
  return `<a class="btn" href="tel:+${intl}">Ligar</a><a class="btn" href="https://wa.me/${intl}" target="_blank" rel="noopener">WhatsApp</a>`;
}
function brokerHtml(it){
  const b = brokerOf(it);
  const others = b ? S.items.filter(x => x.brokerId === b.id && x.id !== it.id).map(x => '#' + x.num) : [];
  return `<div class="section-title">Corretor</div>
    <select id="brokerSel" class="field">
      <option value="">— sem corretor —</option>
      ${S.brokers.map(x => `<option value="${x.id}" ${x.id === it.brokerId ? 'selected' : ''}>${esc(x.name || '(sem nome)')}${x.phone ? ' · ' + esc(x.phone) : ''}</option>`).join('')}
      <option value="__new">+ Novo corretor</option>
    </select>
    ${b ? `<div class="bgrid">
        <input id="bName" class="field" placeholder="Nome" value="${esc(b.name)}" autocomplete="off" enterkeyhint="next">
        <input id="bPhone" class="field" type="tel" placeholder="Telefone" value="${esc(b.phone)}" autocomplete="off" enterkeyhint="done">
      </div>
      <div class="actions" id="bLinks">${phoneLinks(b.phone)}</div>
      <div class="hint" id="bHint">${others.length ? 'Também cuida de ' + others.join(', ') + '. ' : ''}Mudar nome ou telefone aqui muda em todos os imóveis dele.</div>` : ''}`;
}
function bindBroker(it){
  const sel = $('#brokerSel');
  sel.onchange = () => {
    if (sel.value === '__new'){
      const b = {id:String(Date.now()+Math.random()), name:'', phone:''};
      S.brokers.push(b); it.brokerId = b.id;
      save(); openDetail(it.id); renderList(); renderBrokers(); $('#bName').focus(); return;
    }
    it.brokerId = sel.value || null; save(); openDetail(it.id); renderList(); renderBrokers();
  };
  const b = brokerOf(it); if (!b) return;
  const refresh = () => {
    const opt = sel.querySelector(`option[value="${b.id}"]`);
    if (opt) opt.textContent = (b.name || '(sem nome)') + (b.phone ? ' · ' + b.phone : '');
    $('#bLinks').innerHTML = phoneLinks(b.phone);
    const dup = phoneDigits(b.phone).length >= 10 && S.brokers.find(x => x.id !== b.id && phoneDigits(x.phone) === phoneDigits(b.phone));
    const others = S.items.filter(x => x.brokerId === b.id && x.id !== it.id).map(x => '#' + x.num);
    $('#bHint').innerHTML = dup ? `<span style="color:var(--bad)">${esc(dup.name || 'Outro corretor')} já tem esse telefone. Escolha ele na lista acima em vez de criar outro.</span>`
      : (others.length ? 'Também cuida de ' + others.join(', ') + '. ' : '') + 'Mudar nome ou telefone aqui muda em todos os imóveis dele.';
    clearTimeout(bindBroker._t); bindBroker._t = setTimeout(() => { save(); renderList(); renderBrokers(); }, 400);
  };
  $('#bName').oninput = e => { b.name = e.target.value.trim(); refresh(); };
  $('#bPhone').oninput = e => { b.phone = e.target.value.trim(); refresh(); };
  $('#bName').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); $('#bPhone').focus(); } };
  $('#bPhone').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
}
// corretor criado e deixado em branco some ao fechar
function dropEmptyBrokers(){
  const empty = S.brokers.filter(b => !b.name && !b.phone).map(b => b.id);
  if (!empty.length) return;
  S.brokers = S.brokers.filter(b => !empty.includes(b.id));
  S.items.forEach(it => { if (empty.includes(it.brokerId)) it.brokerId = null; });
}
function renderBrokers(){
  const box = $('#brokers');
  const list = S.brokers.filter(b => b.name || b.phone);
  if (!list.length){ box.innerHTML = '<div class="empty" style="padding:8px">Nenhum ainda. Abra um imóvel e escolha “+ Novo corretor”.</div>'; return; }
  box.innerHTML = list.map(b => {
    const its = S.items.filter(x => x.brokerId === b.id).sort((x,y) => x.num - y.num);
    return `<div class="refrow" data-id="${b.id}">
      <div style="flex:1;min-width:0">
        <input data-f="name" value="${esc(b.name)}" placeholder="Nome" aria-label="Nome do corretor" enterkeyhint="done">
        <input data-f="phone" type="tel" value="${esc(b.phone)}" placeholder="Telefone" aria-label="Telefone" enterkeyhint="done" style="font-weight:400">
        <small>${its.length ? 'Imóveis ' + its.map(x => '#' + x.num).join(', ') : 'Nenhum imóvel'}</small>
      </div>
      <div class="actions" style="margin:0;flex-direction:column;align-items:flex-end">${phoneLinks(b.phone).replace(/class="btn"/g, 'class="btn" style="padding:6px 10px;font-size:13px"')}</div>
      <button class="del" type="button" aria-label="Excluir corretor">✕</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.refrow').forEach(row => {
    const b = S.brokers.find(x => x.id === row.dataset.id), del = row.querySelector('.del');
    row.querySelectorAll('input').forEach(inp => {
      inp.oninput = () => { b[inp.dataset.f] = inp.value.trim(); clearTimeout(renderBrokers._t); renderBrokers._t = setTimeout(() => { save(); renderList(); }, 400); };
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
      inp.onblur = () => renderBrokers();
    });
    del.onclick = () => {
      if (del.classList.contains('armed')){ S.items.forEach(it => { if (it.brokerId === b.id) it.brokerId = null; }); S.brokers = S.brokers.filter(x => x.id !== b.id); save(); renderAll(); toast('Corretor removido'); }
      else { del.classList.add('armed'); del.textContent = 'Excluir?'; }
    };
  });
}

function openSheet(){ $('#scrim').classList.add('open'); }
function closeSheet(){ $('#scrim').classList.remove('open'); dropEmptyBrokers(); save(); renderAll(); }
$('#scrim').onclick = e => { if (e.target.id==='scrim') closeSheet(); };

/* ---------- lista ---------- */
function rankedList(){
  return S.items.filter(it=>status(it)!=='disq').sort((a,b)=>score(b)-score(a) || a.num-b.num);
}
function renderList(){
  const box = $('#list');
  if (!S.items.length){ box.innerHTML = '<div class="empty">Nenhum imóvel ainda. Cole as coordenadas ou busque um endereço acima.</div>'; $('#listTitle').textContent = 'Imóveis'; return; }
  const ranked = rankedList();
  const disq = S.items.filter(it=>status(it)==='disq').sort((a,b)=>a.num-b.num);
  const order = S.sort==='num' ? [...S.items].sort((a,b)=>a.num-b.num) : [...ranked, ...disq];
  box.innerHTML = order.map(it => {
    const st = status(it), sc = score(it), ins = inside(it), r = ranked.findIndex(x=>x.id===it.id);
    const meta = st==='disq' ? esc(disqReason(it))
      : [ins===null?null:orlaTxt(it), brokerOf(it)?.name || null, st==='pending'?'Questionário pendente':st==='partial'?'Respostas faltando':null].filter(Boolean).join(' · ');
    return `<div class="card ${st==='disq'?'disq':''}" role="button" tabindex="0" data-id="${it.id}">
      <div class="num ${st}">${it.num}</div>
      <div class="body"><div class="addr">${esc(shortAddr(it.address))}</div><div class="meta">${meta}</div></div>
      <div class="score">${st==='disq' ? '<small>fora</small>' : `<b>${sc}</b><span class="rank">${r+1}º</span>`}</div>
      <button class="del" type="button" data-del="${it.id}" aria-label="Excluir #${it.num}">✕</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(c => c.onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del){
      e.stopPropagation();
      if (del.classList.contains('armed')){ const n = S.items.find(x=>x.id===del.dataset.del).num; removeItem(del.dataset.del); toast(`#${n} excluído — numeração refeita`); }
      else { box.querySelectorAll('.del.armed').forEach(x=>{x.classList.remove('armed'); x.textContent='✕';}); del.classList.add('armed'); del.textContent='Excluir?'; }
      return;
    }
    const it=S.items.find(x=>x.id===c.dataset.id); map.setView([it.lat,it.lng], Math.max(map.getZoom(),15)); openDetail(c.dataset.id);
  });
  const n = S.items.length, nd = disq.length;
  $('#listTitle').textContent = `Imóveis (${n}${nd?` · ${nd} desclassificado${nd>1?'s':''}`:''})`;
}
document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { S.sort=b.dataset.sort; save(); renderAll(); });

/* ---------- círculo / pesos ---------- */
function renderCircleSettings(){
  $('#radius').value = S.radius; $('#radiusRange').value = Math.min(10000, S.radius);
  $('#centerInfo').textContent = S.center ? 'Centro: ' + shortAddr(S.center.label) + '' : 'Sem centro definido. Toque no ícone do círculo e cole as coordenadas, busque um endereço ou toque no mapa.';
}
function setRadius(v){ v = Math.max(50, Math.round(+v||0)); if(!v) return; S.radius=v; if(circle) circle.setRadius(v); renderAll(false); clearTimeout(setRadius._t); setRadius._t=setTimeout(save,300); }
$('#radiusRange').oninput = e => { $('#radius').value = e.target.value; setRadius(e.target.value); };
$('#radius').onchange = e => { setRadius(e.target.value); $('#radiusRange').value = Math.min(10000,S.radius); };

function renderWeights(){
  const W = S.W;
  const line = (label, path) => `<span>${esc(label)}</span><input type="number" step="1" data-w="${path}" value="${path.split('.').reduce((o,k)=>o[k],W)}">`;
  let h = '<div class="wgrid">';
  ORLA.forEach(t => h += line(`Distância da orla: ${t.t}`, `circulo.${t.v}`));
  POS.filter(p=>!p.auto).forEach(p => { if(p.choices) p.choices.forEach(c=>h+=line(`${p.label}: ${c.t}`, `${p.key}.${c.v}`)); else h+=line(p.label, p.key); });
  NEG.forEach(n => h += line(`${n.label} (desconta)`, n.key));
  h += '</div>';
  $('#weights').innerHTML = h;
  $('#weights').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const path = inp.dataset.w.split('.'); let o = S.W; while(path.length>1) o = o[path.shift()];
    o[path[0]] = Math.abs(Math.round(+inp.value||0)); inp.value = o[path[0]]; save(); renderAll(false);
  });
}
$('#resetWeights').onclick = () => { S.W = structuredClone(DEFAULT_W); save(); renderWeights(); renderAll(false); toast('Pesos restaurados'); };

/* ---------- backup ---------- */
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'caca-ape-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
};
$('#copyBtn').onclick = async () => { try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('JSON copiado'); }catch(e){ toast('Não foi possível copiar'); } };
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ const d = JSON.parse(await f.text()); if(!Array.isArray(d.items)) throw 0;
    S = hydrate(d); renumber(); save(); drawCircle(); renderWeights(); renderAll(); toast(`${S.items.length} imóveis importados`);
  }catch(err){ toast('Arquivo inválido'); }
  e.target.value='';
};

/* ---------- render ---------- */
function renderBanner(){
  let h = '';
  if (pendingManual !== null) h =`<div class="banner"><span>Toque no mapa onde fica “${esc(pendingManual)}”.</span><button class="btn" type="button" id="cancelManual">Cancelar</button></div>`;
  else if (mode==='center') h = `<div class="banner"><span>Busque o endereço do centro ou toque no mapa.</span><button class="btn" type="button" id="cancelCenter">Cancelar</button></div>`;
  else if (mode==='ref') h = `<div class="banner"><span>Cole as coordenadas, busque o endereço ou toque no mapa para marcar o ponto de referência.</span><button class="btn" type="button" id="cancelCenter">Cancelar</button></div>`;
  else if (!saveOk) h = `<div class="banner"><span>Este navegador não está permitindo salvar. Use “Baixar backup”.</span></div>`;
  $('#banner').innerHTML = h;
  const c1=$('#cancelManual'); if(c1) c1.onclick=()=>{pendingManual=null; renderBanner();};
  const c2=$('#cancelCenter'); if(c2) c2.onclick=()=>setMode('add');
}
function renderAll(redrawCircle=true){
  document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('on', b.dataset.sort===S.sort));
  renderList(); drawMarkers(); drawRefs(); renderRefs(); renderBrokers(); renderCircleSettings();
}

drawCircle(); renderWeights(); renderAll(); renderBanner();
{ const pts = S.items.map(i=>[i.lat,i.lng]); if (S.center) pts.push([S.center.lat,S.center.lng]);
  if (pts.length > 1) map.fitBounds(pts, {padding:[30,30], maxZoom:16}); else if (pts.length===1) map.setView(pts[0], 15); }
</script>
