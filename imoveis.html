<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caça-apê — mapa e ranking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --bad:#b4442f; --bad-soft:#f6e3de;
    --warn:#a8731a; --warn-soft:#f7ecd6; --pending:#8a8983;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%;padding-bottom:env(safe-area-inset-bottom)}
  #map{height:46vh;min-height:260px;flex:none;border-bottom:1px solid var(--line)}
  @media (min-width:900px){
    .app{flex-direction:row}
    #map{height:100%;flex:1;border-bottom:none;border-right:1px solid var(--line)}
    .panel{width:420px;flex:none}
  }
  .panel{flex:1;overflow:auto;padding:14px 14px 40px}
  .row{display:flex;gap:8px;align-items:center}
  .search input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad);border-color:#e8c7bf}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
  .btn:disabled{opacity:.5}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .chip{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .section-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .results{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .results button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:14px}
  .results button:last-child{border-bottom:0}
  .hint{font-size:13px;color:var(--muted);margin:6px 0}
  .banner{background:var(--warn-soft);color:#5d420f;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
  .card.disq{opacity:.6}
  .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--pending)}
  .num.done{background:var(--accent)} .num.disq{background:var(--bad)} .num.partial{background:var(--warn)}
  .card .body{flex:1;min-width:0}
  .card .addr{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .score{flex:none;text-align:right}
  .score b{font-size:20px;display:block;line-height:1}
  .score small{font-size:11px;color:var(--muted)}
  .rank{font-size:11px;color:var(--muted)}
  .card{cursor:pointer}
  .del{flex:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:8px;margin:-8px -6px -8px 0;border-radius:8px}
  .del.armed{background:var(--bad);color:#fff;font-size:13px;padding:8px 10px}
  .empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
  .settings{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .settings label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  .settings input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px}
  .wgrid{display:grid;grid-template-columns:1fr 70px;gap:6px 10px;align-items:center;font-size:14px}
  .wgrid input{width:70px!important}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;z-index:2000;align-items:flex-end;justify-content:center}
  .scrim.open{display:flex}
  @media (min-width:700px){.scrim{align-items:center}}
  .sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:700px){.sheet{border-radius:18px}}
  .sheet h2{font-size:18px;margin:0 0 4px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .phase{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;margin-bottom:10px}
  .phase.dq{background:var(--bad-soft);color:var(--bad)}
  .phase.pos{background:var(--accent-soft);color:var(--accent)}
  .phase.neg{background:var(--warn-soft);color:var(--warn)}
  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
  .progress i{display:block;height:100%;background:var(--accent)}
  .question{font-size:22px;font-weight:650;margin:4px 0 6px}
  .qpts{color:var(--muted);font-size:13px;margin-bottom:16px}
  .answers{display:grid;gap:8px}
  .answers button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;text-align:left;display:flex;justify-content:space-between}
  .answers button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .answers button span{color:var(--muted);font-size:14px}
  .navrow{display:flex;justify-content:space-between;margin-top:14px}
  .brk{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:10px 0}
  .brk div{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .brk div:last-child{border-bottom:0}
  .brk button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%}
  .plus{color:var(--accent);font-weight:600} .minus{color:var(--bad);font-weight:600} .zero{color:var(--muted)}
  .q-unk{color:var(--warn)}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px}
  .total b{font-size:30px}
  .disq-box{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px;margin:10px 0;font-weight:600}
  textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
  .center-dot{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div id="map"></div>
  <div class="panel">
    <form class="row search" id="searchForm">
      <input id="q" placeholder="Digite um endereço…" autocomplete="off" enterkeyhint="search">
      <button class="btn primary" id="searchBtn">Buscar</button>
    </form>
    <div class="chips">
      <button class="chip on" data-mode="add" type="button">Adicionar imóvel</button>
      <button class="chip" data-mode="center" type="button">Definir centro do círculo</button>
    </div>
    <div id="results"></div>
    <div id="banner"></div>

    <div class="section-title" id="listTitle">Imóveis</div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="chips" style="margin:0">
        <button class="chip on" data-sort="score" type="button">Por pontos</button>
        <button class="chip" data-sort="num" type="button">Por número</button>
      </div>
    </div>
    <div id="list"></div>

    <div class="section-title">Círculo</div>
    <div class="settings">
      <div class="hint" id="centerInfo">Sem centro definido. Use “Definir centro do círculo” e busque um endereço ou toque no mapa.</div>
      <label for="radius">Raio (metros)</label>
      <div class="row">
        <input type="range" id="radiusRange" min="200" max="10000" step="50" style="flex:1">
        <input type="number" id="radius" min="50" step="50">
      </div>
    </div>

    <div class="section-title">Pesos</div>
    <details class="settings">
      <summary>Editar pontuação de cada critério</summary>
      <div id="weights"></div>
      <div class="actions"><button class="btn" id="resetWeights" type="button">Restaurar padrão</button></div>
    </details>

    <div class="section-title">Google Maps</div>
    <div class="settings" id="keyBox"></div>

    <div class="section-title">Backup</div>
    <div class="settings">
      <div class="hint">Os dados ficam salvos neste navegador. Exporte um backup para levar para outro aparelho.</div>
      <div class="actions">
        <button class="btn" id="exportBtn" type="button">Baixar backup</button>
        <button class="btn" id="copyBtn" type="button">Copiar JSON</button>
        <label class="btn" style="margin:0">Importar<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
if (typeof L === 'undefined'){
  document.getElementById('map').innerHTML = '<div style="padding:20px;font-size:14px;color:#b4442f">O mapa não carregou: este visualizador bloqueia scripts e conexões externas. Abra o arquivo no Chrome/Safari ou publique na Vercel.</div>';
  document.getElementById('searchForm').onsubmit = e => { e.preventDefault(); };
  throw new Error('Leaflet indisponível');
}
/* ---------- critérios ---------- */
const DQ = [
  {key:'animais', q:'Aceita animais?', reason:'Não aceita animais'},
  {key:'tela',    q:'Aceita colocar tela de proteção?', reason:'Não aceita tela de proteção'},
  {key:'quartos', q:'Tem 3 quartos ou mais?', reason:'Menos de 3 quartos'},
  {key:'sol',     q:'Bate sol?', reason:'Não bate sol'},
  {key:'suv',     q:'Cabe uma SUV na garagem?', reason:'SUV não cabe na garagem'},
];
// ordem de pergunta = ordem da lista (maior peso primeiro). "circulo" é calculado pelo mapa.
const POS = [
  {key:'circulo', label:'Dentro do círculo', auto:true},
  {key:'valor', label:'Valor', q:'Qual o valor total?', choices:[
    {v:'5k', t:'Até R$ 5 mil'}, {v:'6k', t:'Até R$ 6 mil'}, {v:'7k', t:'Até R$ 7 mil'}, {v:'mais', t:'Acima de R$ 7 mil'}]},
  {key:'metragem', label:'Metragem', q:'Qual a metragem?', choices:[
    {v:'135', t:'Acima de 135 m²'}, {v:'120', t:'Acima de 120 m² (até 135)'}, {v:'menos', t:'120 m² ou menos'}]},
  {key:'vaga', label:'Vaga demarcada', q:'A vaga é demarcada?'},
  {key:'portaria', label:'Portaria', q:'Tem portaria?'},
  {key:'armario', label:'Armários', q:'Tem armários?'},
  {key:'varanda', label:'Varanda', q:'Tem varanda?'},
  {key:'bicicletario', label:'Bicicletário', q:'Tem bicicletário?'},
  {key:'split', label:'Ar split', q:'Tem ar split (ou infra para split)?'},
  {key:'elevador', label:'Elevador', q:'Tem elevador?'},
  {key:'v110', label:'110V', q:'A voltagem é 110V?'},
];
const NEG = [
  {key:'fianca', label:'Só seguro fiança', q:'Só aceita seguro fiança?'},
  {key:'chato', label:'Proprietário chato', q:'O proprietário é chato?'},
  {key:'andarBaixo', label:'Andar baixo', q:'O andar é baixo?'},
  {key:'movimentada', label:'Frente p/ rua movimentada', q:'É de frente para rua movimentada?'},
];
const DEFAULT_W = {
  circulo:11,
  valor:{'5k':10,'6k':7,'7k':3,'mais':0},
  metragem:{'135':9,'120':5,'menos':0},
  vaga:8, portaria:7, armario:6, varanda:5, bicicletario:4, split:3, elevador:2, v110:1,
  fianca:4, chato:3, andarBaixo:2, movimentada:1
};

/* ---------- estado ---------- */
const KEY = 'cacaApe.v1';
let S = load();
// numeração sempre 1..n, na ordem em que os imóveis foram adicionados
function renumber(){ S.items.sort((a,b)=>a.num-b.num).forEach((it,i)=>it.num=i+1); S.nextNum = S.items.length+1; }
function removeItem(id){ const it = S.items.find(x=>x.id===id); S.items = S.items.filter(x=>x.id!==id); renumber(); save(); renderAll(); return it; }
renumber();
function blank(){ return {center:null, radius:1500, items:[], nextNum:1, sort:'score', W:structuredClone(DEFAULT_W)}; }
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); return Object.assign(blank(), d, {W:Object.assign(structuredClone(DEFAULT_W), d.W||{})}); } }catch(e){}
  return blank();
}
let saveOk = true;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); saveOk = true; }
  catch(e){ saveOk = false; }
  renderBanner();
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function dist(a,b){ const R=6371000, r=Math.PI/180; const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function inside(it){ return S.center ? dist(S.center, it) <= S.radius : null; }
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1).replace('.',',')+' km' : Math.round(m)+' m'; }
function shortAddr(d){ return d.split(',').slice(0,3).join(',').trim(); }

/* ---------- pontuação ---------- */
function status(it){
  const a = it.answers||{};
  if (DQ.some(d => a[d.key] === false)) return 'disq';
  const keys = [...DQ.map(d=>d.key), ...POS.filter(p=>!p.auto).map(p=>p.key), ...NEG.map(n=>n.key)];
  const answered = keys.filter(k => k in a && a[k] !== null).length;
  if (answered === 0) return 'pending';
  return answered === keys.length ? 'done' : 'partial';
}
function breakdown(it){
  const a = it.answers||{}, W = S.W, rows = [];
  const ins = inside(it);
  rows.push({key:'circulo', label:'Dentro do círculo', val: ins===null?'sem círculo':(ins?'Sim':'Não'), pts: ins?W.circulo:0, unk: ins===null});
  for (const p of POS.filter(p=>!p.auto)){
    const v = a[p.key];
    if (p.choices){
      const c = p.choices.find(c=>c.v===v);
      rows.push({key:p.key, label:p.label, val:c?c.t:'—', pts:c?(W[p.key][v]||0):0, unk:!c});
    } else {
      rows.push({key:p.key, label:p.label, val:v===true?'Sim':v===false?'Não':'—', pts:v===true?W[p.key]:0, unk:v==null});
    }
  }
  for (const n of NEG){
    const v = a[n.key];
    rows.push({key:n.key, label:n.label, val:v===true?'Sim':v===false?'Não':'—', pts:v===true?-W[n.key]:0, unk:v==null, neg:true});
  }
  return rows;
}
function score(it){ return status(it)==='disq' ? null : breakdown(it).reduce((s,r)=>s+r.pts,0); }
function maxScore(){ const W=S.W; return W.circulo+Math.max(...Object.values(W.valor))+Math.max(...Object.values(W.metragem))+POS.filter(p=>!p.auto&&!p.choices).reduce((s,p)=>s+W[p.key],0); }
function disqReason(it){ const a=it.answers||{}; return DQ.filter(d=>a[d.key]===false).map(d=>d.reason).join(' · '); }

/* ---------- mapa (Google Maps com chave; OpenStreetMap sem chave) ---------- */
const GKEY = 'cacaApe.gkey';
function getKey(){ try{ return localStorage.getItem(GKEY)||''; }catch(e){ return ''; } }
const COLORS = {done:'#2f6f5e', partial:'#a8731a', pending:'#8a8983', disq:'#b4442f'};
let map = null, mapError = '';
const htmlEl = h => { const d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; };
const pinHtml = it => `<div class="pin" style="background:${COLORS[status(it)]}"><span>${it.num}</span></div>`;

function loadGoogle(key){
  return new Promise((res, rej) => {
    window.__gmInit = () => res();
    window.gm_authFailure = () => { mapError = 'O Google recusou a chave (verifique se a Maps JavaScript API está ativa e se o domínio está liberado).'; renderBanner(); renderKeyBox(); };
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&loading=async&libraries=marker,geocoding&language=pt-BR&region=BR&callback=__gmInit`;
    s.async = true; s.onerror = () => rej(new Error('script do Google não carregou'));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('tempo esgotado carregando o Google')), 15000);
  });
}
async function googleAdapter(){
  const {Map, Circle} = await google.maps.importLibrary('maps');
  const {AdvancedMarkerElement} = await google.maps.importLibrary('marker');
  const g = new Map(document.getElementById('map'), {center:{lat:-23.965,lng:-46.333}, zoom:13, mapId:'DEMO_MAP_ID',
    gestureHandling:'greedy', clickableIcons:false, streetViewControl:false, mapTypeControl:false, fullscreenControl:false});
  const ll = p => typeof p.lat === 'function' ? {lat:p.lat(), lng:p.lng()} : {lat:p.lat, lng:p.lng};
  let circle = null, center = null, markers = [];
  return {
    kind:'google',
    setView([lat,lng], z){ g.setCenter({lat,lng}); if (z) g.setZoom(z); },
    getZoom(){ return g.getZoom(); },
    onClick(fn){ g.addListener('click', e => e.latLng && fn(e.latLng.lat(), e.latLng.lng())); },
    fitPoints(pts){ if (!pts.length) return; if (pts.length===1) return this.setView(pts[0], 15);
      const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend({lat:p[0], lng:p[1]})); g.fitBounds(b, 40); },
    setCircle(c, r, onDrag){
      if (circle){ circle.setMap(null); circle = null; } if (center){ center.map = null; center = null; }
      if (!c) return;
      circle = new Circle({map:g, center:{lat:c.lat,lng:c.lng}, radius:r, strokeColor:'#2f6f5e', strokeWeight:2, fillColor:'#2f6f5e', fillOpacity:.1, clickable:false});
      center = new AdvancedMarkerElement({map:g, position:{lat:c.lat,lng:c.lng}, content:htmlEl('<div class="center-dot" style="transform:translateY(50%)"></div>'), gmpDraggable:true});
      center.addListener('dragend', () => { const p = ll(center.position); onDrag(p.lat, p.lng); });
    },
    setRadius(r){ if (circle) circle.setRadius(r); },
    fitCircle(){ if (circle) g.fitBounds(circle.getBounds(), 20); },
    setMarkers(list){
      markers.forEach(m => m.map = null);
      markers = list.map(o => { const m = new AdvancedMarkerElement({map:g, position:{lat:o.lat,lng:o.lng}, content:htmlEl(o.html), gmpDraggable:true});
        m.addListener('click', o.onClick); m.addListener('dragend', () => { const p = ll(m.position); o.onDrag(p.lat, p.lng); }); return m; });
    }
  };
}
function leafletAdapter(){
  const m = L.map('map', {zoomControl:true}).setView([-23.965,-46.333], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
  let circle = null, center = null, markers = [];
  return {
    kind:'osm',
    setView(p, z){ m.setView(p, z); },
    getZoom(){ return m.getZoom(); },
    onClick(fn){ m.on('click', e => fn(e.latlng.lat, e.latlng.lng)); },
    fitPoints(pts){ if (!pts.length) return; if (pts.length===1) return m.setView(pts[0], 15); m.fitBounds(pts, {padding:[30,30], maxZoom:16}); },
    setCircle(c, r, onDrag){
      if (circle){ m.removeLayer(circle); circle = null; } if (center){ m.removeLayer(center); center = null; }
      if (!c) return;
      circle = L.circle([c.lat,c.lng], {radius:r, color:'#2f6f5e', weight:2, fillColor:'#2f6f5e', fillOpacity:.1, interactive:false}).addTo(m);
      center = L.marker([c.lat,c.lng], {draggable:true, icon:L.divIcon({className:'', html:'<div class="center-dot"></div>', iconSize:[14,14], iconAnchor:[7,7]})}).addTo(m);
      center.on('dragend', e => { const p = e.target.getLatLng(); onDrag(p.lat, p.lng); });
    },
    setRadius(r){ if (circle) circle.setRadius(r); },
    fitCircle(){ if (circle) m.fitBounds(circle.getBounds(), {padding:[20,20]}); },
    setMarkers(list){
      markers.forEach(x => m.removeLayer(x));

        k.on('click', o.onClick); k.on('dragend', e => { const p = e.target.getLatLng(); o.onDrag(p.lat, p.lng); }); return k; });
    }
  };
}

$('#searchForm').onsubmit = async e => {

async function withTimeout(url, ms=8000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const UF = {'Acre':'AC','Alagoas':'AL','Amapá':'AP','Amazonas':'AM','Bahia':'BA','Ceará':'CE','Distrito Federal':'DF','Espírito Santo':'ES','Goiás':'GO','Maranhão':'MA','Mato Grosso':'MT','Mato Grosso do Sul':'MS','Minas Gerais':'MG','Pará':'PA','Paraíba':'PB','Paraná':'PR','Pernambuco':'PE','Piauí':'PI','Rio de Janeiro':'RJ','Rio Grande do Norte':'RN','Rio Grande do Sul':'RS','Rondônia':'RO','Roraima':'RR','Santa Catarina':'SC','São Paulo':'SP','Sergipe':'SE','Tocantins':'TO'};
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
// número da casa digitado (ignora CEP)
function parseNumber(q){
  const s = q.replace(/\b\d{5}-?\d{3}\b/g,' ');
  const m = s.match(/(?:,|\bn[º°o.]?|\bn[uú]mero)\s*(\d{1,5})\b/i);
  if (m) return +m[1];
  // senão, o último número solto que não faz parte do nome (ex.: "Rua 15 de Novembro")
  const all = [...s.matchAll(/\s(\d{1,5})\b(?!\s*(?:de|º|ª)\b)/gi)];
  return all.length ? +all[all.length-1][1] : null;
}
function errMsg(e){ return e.name==='AbortError' ? 'tempo esgotado' : e.message; }

// Nominatim primeiro; se falhar ou vier vazio, tenta Photon. Agrupa trechos repetidos da mesma rua (um por CEP).
async function geocode(q){
  if (map && map.kind === 'google'){
    try{ return await geocodeGoogle(q); }
    catch(e){ toast('Busca do Google falhou ('+(e.code||e.message)+'). Usando OpenStreetMap.'); }
  }
  return geocodeOSM(q);
}
async function geocodeGoogle(q){
  const {Geocoder} = await google.maps.importLibrary('geocoding');
  let results;
  try{ ({results} = await new Geocoder().geocode({address:q, region:'br', componentRestrictions:{country:'BR'}})); }
  catch(e){ if (e.code === 'ZERO_RESULTS') return []; throw e; }
  const num = parseNumber(q);
  return results.slice(0,6).map(r => {
    const lt = r.geometry.location_type, hasNum = r.address_components.some(c => c.types.includes('street_number'));
    return {lat:r.geometry.location.lat(), lon:r.geometry.location.lng(), label:r.formatted_address.replace(/, (Brasil|Brazil)$/,''),
      google:true, num, exact:hasNum, precision: hasNum && (lt==='ROOFTOP' || lt==='RANGE_INTERPOLATED') ? 'numero' : lt==='APPROXIMATE' ? 'local' : 'rua'};
  });
}
async function geocodeOSM(q){
  const num = parseNumber(q), errs = [];
  let list = [];
  try{
    const d = await withTimeout('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=15&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q));
    list = d.map(x => { const a = x.address||{};
      return {lat:+x.lat, lon:+x.lon, road:a.road||a.pedestrian||a.footway||x.name, hn:a.house_number||null,
        suburb:a.suburb||a.neighbourhood||a.city_district||a.quarter||'', city:a.city||a.town||a.municipality||a.village||'',
        uf:(a['ISO3166-2-lvl4']||'').replace('BR-','') || UF[a.state] || ''}; });
  }catch(e){ errs.push('Nominatim: '+errMsg(e)); }
  if (!list.length){
    try{
      const d = await withTimeout('https://photon.komoot.io/api/?limit=15&bbox=-74,-34,-34,5.5&q='+encodeURIComponent(q));
      list = (d.features||[]).map(f => { const p = f.properties||{};
        return {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], road:p.street||p.name, hn:p.housenumber||null,
          suburb:p.district||p.locality||'', city:p.city||p.county||'', uf:UF[p.state]||''}; });
    }catch(e){ errs.push('Photon: '+errMsg(e)); }
  }
  if (!list.length && errs.length) throw new Error(errs.join(' · '));
  const seen = new Set(), out = [];
  for (const r of list){
    const k = norm([r.road, r.hn, r.suburb, r.city].join('|'));
    if (seen.has(k)) continue; seen.add(k);
    const n = r.hn || num;
    r.label = [r.road ? r.road + (n ? ', ' + n : '') : null, r.suburb, r.city ? r.city + (r.uf ? ' - ' + r.uf : '') : null].filter(Boolean).join(' — ');
    r.num = num; r.exact = !!r.hn;
    out.push(r);
    if (out.length >= 6) break;
  }
  return out;
}

// OpenStreetMap quase não tem numeração no Brasil: acha o CEP do trecho pelo número (ViaCEP) e pega a coordenada do CEP
function inRange(comp, n){
  const c = norm(comp);
  if (!c) return true;
  let lo = 0, hi = Infinity, m;
  if ((m = c.match(/de\s+(\d+)(?:\/(\d+))?\s+ao\s+fim/))) lo = +m[1];
  else if ((m = c.match(/de\s+(\d+)(?:\/(\d+))?\s+a\s+(\d+)(?:\/(\d+))?/))) { lo = +m[1]; hi = +(m[4]||m[3]); }
  else if ((m = c.match(/ate\s+(\d+)(?:\/(\d+))?/))) hi = +(m[2]||m[1]);
  else if (!/lado/.test(c)) return false;
  if (/lado\s+impar/.test(c) && n % 2 === 0) return false;
  if (/lado\s+par/.test(c) && n % 2 === 1) return false;
  return n >= lo && n <= hi;
}
async function refineByNumber(r){
  if (!r.num || r.exact || !r.road || !r.city || !r.uf) return null;
  const tries = [r.road, r.road.replace(/^(rua|avenida|av\.?|travessa|alameda|praca|praça|estrada|rodovia)\s+/i,'')];
  let rows = [];
  for (const t of tries){
    if (t.length < 3) continue;
    try{
      const d = await withTimeout(`https://viacep.com.br/ws/${r.uf}/${encodeURIComponent(r.city)}/${encodeURIComponent(t)}/json/`, 7000);
      if (Array.isArray(d) && d.length){ rows = d; break; }
    }catch(e){}
  }
  if (!rows.length) return null;
  const same = rows.filter(x => norm(x.logradouro) === norm(r.road));
  const pool = same.length ? same : rows;
  const hit = pool.find(x => x.complemento && inRange(x.complemento, r.num)) || (pool.length === 1 ? pool[0] : null);
  if (!hit) return null;
  const cep = hit.cep.replace(/\D/g,'');
  try{
    const a = await withTimeout(`https://cep.awesomeapi.com.br/json/${cep}`, 7000);
    if (a && a.lat && a.lng) return {lat:+a.lat, lon:+a.lng, cep:hit.cep, bairro:hit.bairro};
  }catch(e){}
  try{
    const b = await withTimeout(`https://brasilapi.com.br/api/cep/v2/${cep}`, 7000);
    const c = b && b.location && b.location.coordinates;
    if (c && c.latitude && c.longitude) return {lat:+c.latitude, lon:+c.longitude, cep:hit.cep, bairro:hit.bairro};
  }catch(e){}
  return {cep:hit.cep, bairro:hit.bairro};
}
function showResults(q, data){
  const box = $('#results');
  if (!data.length){
    box.innerHTML = `<div class="banner"><span>Nenhum resultado. Marque tocando no mapa.</span><button class="btn" type="button" id="manualBtn">Marcar no mapa</button></div>`;
    $('#manualBtn').onclick = () => startManual(q); return;
  }
  box.innerHTML = '<div class="results">' + data.map((d,i)=>`<button type="button" data-i="${i}">${esc(d.label)}</button>`).join('') +
    `<button type="button" data-manual="1" style="color:var(--muted)">Nenhum desses — marcar no mapa</button></div>`;
  box.querySelectorAll('button[data-i]').forEach(b => b.onclick = async () => {
    const r = await resolveResult(data[+b.dataset.i], box);
    pick(q, r.lat, r.lon, r.label, {precision:r.precision, cep:r.cep});
  });
  box.querySelector('[data-manual]').onclick = () => startManual(q);
}
async function resolveResult(d, box){
  if (d.google) return {lat:d.lat, lon:d.lon, label:d.label, precision:d.precision, cep:null};
  let lat = d.lat, lon = d.lon, precision = d.exact ? 'numero' : (d.num ? 'rua' : 'local'), cep = null;
  if (d.num && !d.exact){
    if (box) box.innerHTML = '<div class="hint">Localizando o número '+d.num+'…</div>';
    const ref = await refineByNumber(d);
    if (ref){ cep = ref.cep; if (ref.lat && dist({lat:ref.lat,lng:ref.lon},{lat:d.lat,lng:d.lon}) <= 1200){ lat = ref.lat; lon = ref.lon; precision = 'cep'; } }
  }
  return {lat, lon, label:d.label, precision, cep};
}
function startManual(q){ pendingManual = q; $('#results').innerHTML=''; renderBanner(); }
function onMapClick(lat, lng){

function pick(q, lat, lng, display, extra={}){

/* ---------- questionário ---------- */
function steps(){
  return [
    ...DQ.map(d=>({...d, phase:'dq'})),
    ...POS.filter(p=>!p.auto).map(p=>({...p, phase:'pos'})),
    ...NEG.map(n=>({...n, phase:'neg'})),
  ];
}
function startWizard(id, i){ renderStep(id, i); openSheet(); }
function renderStep(id, i){
  const it = S.items.find(x=>x.id===id); if(!it) return closeSheet();
  const ST = steps();
  if (i >= ST.length) return openDetail(id);
  const s = ST[i], a = it.answers, W = S.W, cur = a[s.key];
  const phaseTxt = {dq:'Eliminatória', pos:'Pontua', neg:'Tira pontos'}[s.phase];
  let ptsTxt = '';
  if (s.phase==='dq') ptsTxt = '“Não” desclassifica o imóvel.';
  else if (s.phase==='neg') ptsTxt = `“Sim” tira ${W[s.key]} ponto${W[s.key]>1?'s':''}.`;
  else if (!s.choices) ptsTxt = `“Sim” vale ${W[s.key]} ponto${W[s.key]>1?'s':''}.`;
  let opts;
  if (s.choices){
    opts = s.choices.map(c=>({v:c.v, t:c.t, hint:`+${W[s.key][c.v]||0}`}));
  } else {
    opts = [{v:true, t:'Sim'}, {v:false, t:'Não'}];
  }
  opts.push({v:null, t:'Não sei ainda', hint:'pular'});
  const insideTxt = (()=>{ const ins=inside(it); if(ins===null) return 'Sem círculo definido'; return (ins?'Dentro':'Fora')+' do círculo · '+fmtDist(dist(S.center,it))+' do centro'; })();
  $('#sheet').innerHTML = `
    <h2>#${it.num} ${esc(shortAddr(it.address))}</h2>
    <div class="sub">${esc(insideTxt)}</div>
    <div class="progress"><i style="width:${Math.round(i/ST.length*100)}%"></i></div>
    <span class="phase ${s.phase}">${phaseTxt}</span>
    <div class="question">${esc(s.q)}</div>
    <div class="qpts">${ptsTxt}</div>
    <div class="answers">${opts.map((o,k)=>`<button type="button" data-k="${k}" class="${(s.key in a) && cur===o.v ? 'sel':''}">${esc(o.t)}${o.hint?`<span>${esc(o.hint)}</span>`:''}</button>`).join('')}</div>
    <div class="navrow">
      <button class="btn ghost" type="button" id="prev" ${i===0?'disabled':''}>← Voltar</button>
      <button class="btn ghost" type="button" id="toDetail">Ver resumo</button>
    </div>`;
  $('#sheet').querySelectorAll('.answers button').forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.k];
    it.answers[s.key] = o.v; save(); renderAll();
    if (s.phase==='dq' && o.v===false) return openDetail(id);
    renderStep(id, i+1);
  });
  $('#prev').onclick = () => renderStep(id, i-1);
  $('#toDetail').onclick = () => openDetail(id);
}

/* ---------- detalhe ---------- */
function openDetail(id){
  const it = S.items.find(x=>x.id===id); if(!it) return;

  const ranked = rankedList(); const pos = ranked.findIndex(x=>x.id===id);
  const dqRows = DQ.map(d=>{ const v=it.answers[d.key]; return {key:d.key, label:d.q, val:v===true?'Sim':v===false?'Não':'—', bad:v===false, unk:v==null}; });

    </div>

  $('#sheet').querySelectorAll('[data-step]').forEach(b => b.onclick = () => renderStep(id, +b.dataset.step));

  };
  $('#close').onclick = closeSheet;

/* ---------- lista ---------- */
function rankedList(){
  return S.items.filter(it=>status(it)!=='disq').sort((a,b)=>score(b)-score(a) || a.num-b.num);
}
function renderList(){
  const box = $('#list');

  const order = S.sort==='num' ? [...S.items].sort((a,b)=>a.num-b.num) : [...ranked, ...disq];
  box.innerHTML = order.map(it => {
    const st = status(it), sc = score(it), ins = inside(it), r = ranked.findIndex(x=>x.id===it.id);
    const meta = st==='disq' ? esc(disqReason(it))
      : [ins===null?null:(ins?'Dentro do círculo':'Fora do círculo')+' · '+fmtDist(dist(S.center,it)), st==='pending'?'Questionário pendente':st==='partial'?'Respostas faltando':null].filter(Boolean).join(' · ');
    return `<div class="card ${st==='disq'?'disq':''}" role="button" tabindex="0" data-id="${it.id}">
      <div class="num ${st}">${it.num}</div>
      <div class="body"><div class="addr">${esc(shortAddr(it.address))}</div><div class="meta">${meta}</div></div>
      <div class="score">${st==='disq' ? '<small>fora</small>' : `<b>${sc}</b><span class="rank">${r+1}º</span>`}</div>
      <button class="del" type="button" data-del="${it.id}" aria-label="Excluir #${it.num}">✕</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(c => c.onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del){
      e.stopPropagation();
      if (del.classList.contains('armed')){ const n = S.items.find(x=>x.id===del.dataset.del).num; removeItem(del.dataset.del); toast(`#${n} excluído — numeração refeita`); }
      else { box.querySelectorAll('.del.armed').forEach(x=>{x.classList.remove('armed'); x.textContent='✕';}); del.classList.add('armed'); del.textContent='Excluir?'; }
      return;
    }
    const it=S.items.find(x=>x.id===c.dataset.id); map && map.setView([it.lat,it.lng], Math.max(map.getZoom(),15)); openDetail(c.dataset.id);
  });
  const n = S.items.length, nd = disq.length;
  $('#listTitle').textContent = `Imóveis (${n}${nd?` · ${nd} desclassificado${nd>1?'s':''}`:''})`;
}
document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { S.sort=b.dataset.sort; save(); renderAll(); });

/* ---------- círculo / pesos ---------- */
function renderCircleSettings(){
  $('#radius').value = S.radius; $('#radiusRange').value = Math.min(10000, S.radius);
  $('#centerInfo').textContent = S.center ? 'Centro: ' + shortAddr(S.center.label) + ' (arraste o ponto preto para ajustar)' : 'Sem centro definido. Use “Definir centro do círculo” e busque um endereço ou toque no mapa.';
}
function setRadius(v){ v = Math.max(50, Math.round(+v||0)); if(!v) return; S.radius=v; if(map) map.setRadius(v); renderAll(false); clearTimeout(setRadius._t); setRadius._t=setTimeout(save,300); }
$('#radiusRange').oninput = e => { $('#radius').value = e.target.value; setRadius(e.target.value); };
$('#radius').onchange = e => { setRadius(e.target.value); $('#radiusRange').value = Math.min(10000,S.radius); };

function renderWeights(){
  const W = S.W;
  const line = (label, path) => `<span>${esc(label)}</span><input type="number" step="1" data-w="${path}" value="${path.split('.').reduce((o,k)=>o[k],W)}">`;
  let h = '<div class="wgrid">';
  h += line('Dentro do círculo','circulo');
  POS.filter(p=>!p.auto).forEach(p => { if(p.choices) p.choices.forEach(c=>h+=line(`${p.label}: ${c.t}`, `${p.key}.${c.v}`)); else h+=line(p.label, p.key); });
  NEG.forEach(n => h += line(`${n.label} (desconta)`, n.key));
  h += '</div>';
  $('#weights').innerHTML = h;
  $('#weights').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const path = inp.dataset.w.split('.'); let o = S.W; while(path.length>1) o = o[path.shift()];
    o[path[0]] = Math.abs(Math.round(+inp.value||0)); inp.value = o[path[0]]; save(); renderAll(false);
  });
}
$('#resetWeights').onclick = () => { S.W = structuredClone(DEFAULT_W); save(); renderWeights(); renderAll(false); toast('Pesos restaurados'); };

/* ---------- chave do Google ---------- */
function renderKeyBox(){
  const key = getKey(), on = map && map.kind === 'google';
  $('#keyBox').innerHTML = `
    <div class="hint">${on ? 'Usando Google Maps: mapa e busca com número de porta.' : key ? 'Chave salva, mas o Google não está ativo.' : 'Sem chave: usando OpenStreetMap, que no Brasil erra bastante a posição pelo número.'}</div>
    <label for="gkey">Chave da API do Google Maps</label>
    <div class="row"><input id="gkey" type="password" autocomplete="off" placeholder="AIza…" value="${esc(key)}" style="flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px">
      <button class="btn primary" type="button" id="saveKey">Salvar</button></div>
    ${key ? '<div class="actions"><button class="btn ghost" type="button" id="dropKey">Remover chave e voltar ao OpenStreetMap</button></div>' : ''}
    <div class="hint">No Google Cloud, ative <b>Maps JavaScript API</b> e <b>Geocoding API</b> e restrinja a chave ao site ${esc(location.origin)}/*. A chave fica só neste navegador e não vai no backup.</div>`;
  $('#saveKey').onclick = () => { const v = $('#gkey').value.trim(); try{ v ? localStorage.setItem(GKEY, v) : localStorage.removeItem(GKEY); }catch(e){} location.reload(); };
  const d = $('#dropKey'); if (d) d.onclick = () => { try{ localStorage.removeItem(GKEY); }catch(e){} location.reload(); };
}

/* ---------- backup ---------- */
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'caca-ape-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
};
$('#copyBtn').onclick = async () => { try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('JSON copiado'); }catch(e){ toast('Não foi possível copiar'); } };
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ const d = JSON.parse(await f.text()); if(!Array.isArray(d.items)) throw 0;
    S = Object.assign(blank(), d, {W:Object.assign(structuredClone(DEFAULT_W), d.W||{})}); renumber(); save(); drawCircle(); renderWeights(); renderAll(); toast(`${S.items.length} imóveis importados`);
  }catch(err){ toast('Arquivo inválido'); }
  e.target.value='';
};

/* ---------- render ---------- */
function renderBanner(){
  let h = '';
  const mv = movingId && S.items.find(x=>x.id===movingId);
  if (mv) h = `<div class="banner"><span>Toque no mapa na nova posição do #${mv.num}.</span><button class="btn" type="button" id="cancelMove">Cancelar</button></div>`;
  else if (pendingManual !== null) h =`<div class="banner"><span>Toque no mapa onde fica “${esc(pendingManual)}”.</span><button class="btn" type="button" id="cancelManual">Cancelar</button></div>`;
  else if (mode==='center') h = `<div class="banner"><span>Busque o endereço do centro ou toque no mapa.</span><button class="btn" type="button" id="cancelCenter">Cancelar</button></div>`;
  else if (mapError) h = `<div class="banner"><span>${esc(mapError)}</span></div>`;
  else if (!saveOk) h = `<div class="banner"><span>Este navegador não está permitindo salvar. Use “Baixar backup”.</span></div>`;
  $('#banner').innerHTML = h;
  const c0=$('#cancelMove'); if(c0) c0.onclick=()=>{movingId=null; renderBanner();};
  const c1=$('#cancelManual'); if(c1) c1.onclick=()=>{pendingManual=null; renderBanner();};
  const c2=$('#cancelCenter'); if(c2) c2.onclick=()=>setMode('add');
}
function renderAll(redrawCircle=true){
  document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('on', b.dataset.sort===S.sort));
  renderList(); drawMarkers(); renderCircleSettings();
}

renderWeights(); renderAll(); renderBanner(); renderKeyBox();
(async () => {
  const key = getKey();
  if (key){
    try{ await loadGoogle(key); map = await googleAdapter(); }
    catch(e){ mapError = 'Google Maps não carregou ('+e.message+'). Usando OpenStreetMap.'; map = null; }
  }
  if (!map){ document.getElementById('map').innerHTML = ''; map = leafletAdapter(); }
  map.onClick(onMapClick);
  drawCircle(); renderAll(); renderBanner(); renderKeyBox();
  const pts = S.items.map(i=>[i.lat,i.lng]); if (S.center) pts.push([S.center.lat,S.center.lng]);
  map.fitPoints(pts);
})();
</script>
</body>
</html>
